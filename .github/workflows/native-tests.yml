name: native-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jackson:
    name: Jackson on JVM and native image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Tests on the JVM
        run: mvn -B -ntp test

      - name: Tests as a native binary
        run: mvn -B -ntp -Pnative test

      - name: Case results
        if: always()
        run: |
          {
            echo '### Jackson cases'
            echo '```'
            cat target/jackson-cases-*.txt 2>/dev/null || echo 'no results were written'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
